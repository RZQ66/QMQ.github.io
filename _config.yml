title: QVQ blog
subtitle: 睡觉中......
description: 个人技术博客，记录逆向、CTF、Windows 与一些有趣的工程笔记。
keywords: Reverse Engineering, CTF, Windows, PE, QVQ
author: QVQ
language: zh-CN
timezone: Asia/Shanghai

url: https://rzq66.github.io/QMQ.github.io
root: /QMQ.github.io/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: prismjs
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

index_generator:
  path: ''
  per_page: 10
  order_by: -date

archive_generator:
  per_page: 20
  yearly: true
  monthly: true
  daily: false

theme: qmq

feed:
  type: atom
  path: atom.xml
  limit: 20

sitemap:
  path: sitemap.xml

search:
  path: search.json
  field: post
  content: true
  format: html

deploy:
  type: ''
